name: Candela
description: 'Candela is a Swedish manufacturer of electric hydrofoiling boats and ferries, on a mission
  to decarbonize waterborne transportation. Its proprietary computer-controlled hydrofoil system, C-Pod
  electric propulsion, and C-Foil technology lift the hull clear of the water to cut energy consumption
  by roughly 80% versus conventional planing hulls, enabling silent, long-range, zero-emission travel.
  Products span leisure craft (the C-8 and C-7 dayboats) and professional vessels (the P-12 electric
  ferry and shuttle for public and commercial transport). Backed by EQT Ventures, Candela is a hardware
  and mobility company; as of this profile it publishes no public developer API, SDKs, or API
  documentation. This record captures its public web presence and domain security posture.'
